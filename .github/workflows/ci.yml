name: CI

on:
  pull_request:
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint and build
    runs-on: ubuntu-latest
    env:
      # Dummy value: src/lib/prisma.ts requires the variable at import time,
      # but nothing connects to a database during lint or build.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4

      # Reads the pnpm version from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # postinstall runs `prisma generate`.
      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      # `next build` also runs the TypeScript check.
      - run: pnpm build
